name: Rename Pixel Naiwa release asset

on:
  push:
    branches: ['pet/pixel-naiwa']
    paths: ['.github/workflows/rename-naiwa-asset.yml']

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rename the existing ZIP and update its references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/pixel-naiwa.zip"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/749754499" > "$asset"
          printf '%s  %s\n' '7a8cd7ee195c9fc4d6d84625b866d8702ef5c2566a49092f81bb373618747e05' "$asset" | sha256sum --check -
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/749754499" \
            -f name=pixel-naiwa.zip --silent
          (cd "$RUNNER_TEMP" && sha256sum pixel-naiwa.zip > SHA256SUMS)
          gh release upload naiwa-v1.1.0 "$RUNNER_TEMP/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber
          notes="$RUNNER_TEMP/naiwa-release.md"
          cp docs/pets/naiwa-release.md "$notes"
          printf '\n[全部动作预览 / All animation previews](https://github.com/%s/blob/%s/README.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$notes"
          gh release edit naiwa-v1.1.0 --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
