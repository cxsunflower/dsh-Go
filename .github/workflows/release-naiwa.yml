name: Publish Pixel Naiwa

on:
  push:
    tags: ['naiwa-v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the ZIP builder and build the pet pack
        run: |
          python3 -m unittest discover -s tooling/pets -p 'test_*.py'
          python3 tooling/pets/build_pet_pack.py --src app/assets/pets/naiwa --out app/build/pet_release/pixel-naiwa.zip
          cd app/build/pet_release
          sha256sum pixel-naiwa.zip > SHA256SUMS
      - name: Publish the tagged pet pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/naiwa-release.md"
          cp docs/pets/naiwa-release.md "$notes"
          printf '\n[按状态预览 / Previews by state](https://github.com/%s/blob/%s/README.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$notes"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              app/build/pet_release/pixel-naiwa.zip app/build/pet_release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "像素奶蛙 ${GITHUB_REF_NAME#naiwa-v}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              app/build/pet_release/pixel-naiwa.zip app/build/pet_release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "像素奶蛙 ${GITHUB_REF_NAME#naiwa-v}" --notes-file "$notes"
          fi
